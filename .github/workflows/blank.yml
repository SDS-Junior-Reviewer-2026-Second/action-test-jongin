# deploy.yml
name: deploy.yml

on: push

jobs:
  build-1:  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1
        run: echo "build-1"

  build-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 2
        run: echo "build-2"

  build-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3
        run: echo "build-3"


  integration-1:
    needs: [build-1]
    runs-on: ubuntu-latest
    steps:
      - name: Integration 1
        run: echo "integration-1"

  integration-2:
    needs: [build-1]
    runs-on: ubuntu-latest
    steps:
      - name: Integration 2
        run: echo "integration-2"


  lint:
    needs: [build-2]
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: echo "lint"


  unit-test:
    needs: [build-3]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-group: [1, 2, 3]

    steps:
      - name: Unit Test ${{ matrix.test-group }}
        run: echo "unit-test group ${{ matrix.test-group }}"


  deploy:
    needs:
      - integration-1
      - integration-2
      - lint
      - unit-test

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "deploy"

  weeeeekend:
    needs:
      - integration-1
      - integration-2
      - lint
      - unit-test
        
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Run KFC automation script
        run: python .github/scripts/kfc.py
